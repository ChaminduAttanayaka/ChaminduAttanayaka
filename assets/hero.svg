<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500">
    <stop stop-color="#050B14"/><stop offset=".5" stop-color="#0A1220"/><stop offset="1" stop-color="#07101C"/>
  </linearGradient>
  <linearGradient id="acc" x1="220" y1="0" x2="980" y2="500">
    <stop stop-color="#2F81F7"/><stop offset=".55" stop-color="#58A6FF"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    @keyframes dash{to{stroke-dashoffset:-80}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes sweep{0%{transform:translateX(-260px);opacity:0}15%{opacity:.35}50%{opacity:.6}85%{opacity:.35}100%{transform:translateX(1450px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:12 13;animation:dash 2.2s linear infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .f1{animation:up 4s ease-in-out infinite}.f2{animation:up 4.8s ease-in-out .5s infinite}.f3{animation:up 5.3s ease-in-out 1s infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
    .sweep{animation:sweep 7s ease-in-out infinite}
  </style>
</defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/>
<g opacity=".08" stroke="#8B949E">
  <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
  <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500M800 0V500M900 0V500M1000 0V500M1100 0V500"/>
</g>
<rect x="-250" y="0" width="180" height="500" fill="url(#acc)" opacity=".09" class="sweep"/>

<g transform="translate(48 38)">
  <rect width="190" height="32" rx="16" fill="#0D1A2B" stroke="#2F81F7" stroke-opacity=".55"/>
  <circle cx="18" cy="16" r="5" fill="#3FB950" class="pulse"/>
  <text x="32" y="21" font-size="12" font-weight="700" letter-spacing="1" fill="#C9D1D9">ENGINEERING ONLINE</text>
</g>

<text x="600" y="118" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="5" fill="#58A6FF">DEVOPS · CLOUD · PLATFORM</text>
<text x="600" y="176" text-anchor="middle" font-size="48" font-weight="800" fill="#F0F6FC">CHAMINDU ATTANAYAKA</text>
<text x="600" y="210" text-anchor="middle" font-size="17" font-weight="500" fill="#8B949E">Automation-first cloud engineering with reliability and observability at the core</text>

<g transform="translate(600 310)">
  <circle r="54" fill="#0C1727" stroke="url(#acc)" stroke-width="2"/>
  <circle r="76" fill="none" stroke="#58A6FF" stroke-opacity=".13"/>
  <g class="spin"><circle cx="0" cy="-76" r="4" fill="#58A6FF" filter="url(#glow)"/></g>
  <text y="-5" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.2" fill="#58A6FF">PLATFORM</text>
  <text y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#C9D1D9">ENGINEERING</text>
</g>

<g stroke="url(#acc)" fill="none" stroke-width="1.7" opacity=".8">
  <path d="M546 294C490 267 430 267 370 283" class="flow"/>
  <path d="M654 294C710 267 770 267 830 283" class="flow"/>
  <path d="M546 328C490 354 430 354 370 338" class="flow"/>
  <path d="M654 328C710 354 770 354 830 338" class="flow"/>
</g>

<g transform="translate(115 246)" class="f1">
  <rect width="265" height="78" rx="18" fill="#0C1727" stroke="#2F81F7" stroke-opacity=".5"/>
  <text x="24" y="32" font-size="14" font-weight="800" fill="#F0F6FC">CLOUD</text>
  <text x="24" y="54" font-size="12" font-weight="600" fill="#8B949E">AWS · Azure · Networking</text>
</g>
<g transform="translate(820 246)" class="f2">
  <rect width="265" height="78" rx="18" fill="#0C1727" stroke="#8B5CF6" stroke-opacity=".5"/>
  <text x="24" y="32" font-size="14" font-weight="800" fill="#F0F6FC">AUTOMATION</text>
  <text x="24" y="54" font-size="12" font-weight="600" fill="#8B949E">Jenkins · Terraform · CI/CD</text>
</g>
<g transform="translate(115 336)" class="f3">
  <rect width="265" height="78" rx="18" fill="#0C1727" stroke="#58A6FF" stroke-opacity=".4"/>
  <text x="24" y="32" font-size="14" font-weight="800" fill="#F0F6FC">KUBERNETES</text>
  <text x="24" y="54" font-size="12" font-weight="600" fill="#8B949E">EKS · Containers · Scaling</text>
</g>
<g transform="translate(820 336)" class="f1">
  <rect width="265" height="78" rx="18" fill="#0C1727" stroke="#58A6FF" stroke-opacity=".4"/>
  <text x="24" y="32" font-size="14" font-weight="800" fill="#F0F6FC">OBSERVABILITY</text>
  <text x="24" y="54" font-size="12" font-weight="600" fill="#8B949E">Prometheus · Grafana · Elastic</text>
</g>

<text x="600" y="465" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="4" fill="#6E7681">BUILD · AUTOMATE · OBSERVE · SCALE</text>
<rect x=".75" y=".75" width="1198.5" height="498.5" rx="27.25" stroke="#30363D" stroke-width="1.5"/>
</svg>