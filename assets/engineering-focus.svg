<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#2F81F7"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif}
 @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
 .a{animation:lift 4s ease-in-out infinite}.b{animation:lift 4.6s ease-in-out .3s infinite}.c{animation:lift 5s ease-in-out .6s infinite}.d{animation:lift 4.3s ease-in-out .9s infinite}
 .dot{animation:blink 2s ease-in-out infinite}
 </style>
</defs>
<rect width="1200" height="330" rx="26" fill="#07101C"/>
<text x="56" y="60" font-size="17" font-weight="800" letter-spacing="3" fill="#58A6FF">ENGINEERING FOCUS</text>
<text x="56" y="90" font-size="13" fill="#8B949E">Four connected disciplines shaping reliable cloud platforms</text>

<g transform="translate(55 125)" class="a">
 <rect width="255" height="150" rx="20" fill="#0C1727" stroke="#2F81F7" stroke-opacity=".55"/>
 <circle cx="28" cy="30" r="5" fill="#58A6FF" class="dot"/>
 <text x="48" y="36" font-size="16" font-weight="800" fill="#F0F6FC">CLOUD</text>
 <text x="24" y="72" font-size="12" fill="#C9D1D9">AWS · Azure</text>
 <text x="24" y="98" font-size="12" fill="#8B949E">Infrastructure · Networking</text>
 <text x="24" y="122" font-size="12" fill="#8B949E">Compute · Containers</text>
</g>
<g transform="translate(325 125)" class="b">
 <rect width="255" height="150" rx="20" fill="#0C1727" stroke="#58A6FF" stroke-opacity=".45"/>
 <circle cx="28" cy="30" r="5" fill="#58A6FF" class="dot"/>
 <text x="48" y="36" font-size="16" font-weight="800" fill="#F0F6FC">PLATFORM</text>
 <text x="24" y="72" font-size="12" fill="#C9D1D9">Kubernetes · EKS</text>
 <text x="24" y="98" font-size="12" fill="#8B949E">Orchestration · Scaling</text>
 <text x="24" y="122" font-size="12" fill="#8B949E">Availability · Operations</text>
</g>
<g transform="translate(595 125)" class="c">
 <rect width="255" height="150" rx="20" fill="#0C1727" stroke="#8B5CF6" stroke-opacity=".5"/>
 <circle cx="28" cy="30" r="5" fill="#A78BFA" class="dot"/>
 <text x="48" y="36" font-size="16" font-weight="800" fill="#F0F6FC">AUTOMATION</text>
 <text x="24" y="72" font-size="12" fill="#C9D1D9">Jenkins · Terraform</text>
 <text x="24" y="98" font-size="12" fill="#8B949E">CI/CD · IaC</text>
 <text x="24" y="122" font-size="12" fill="#8B949E">Release Engineering</text>
</g>
<g transform="translate(865 125)" class="d">
 <rect width="255" height="150" rx="20" fill="#0C1727" stroke="#2F81F7" stroke-opacity=".45"/>
 <circle cx="28" cy="30" r="5" fill="#58A6FF" class="dot"/>
 <text x="48" y="36" font-size="16" font-weight="800" fill="#F0F6FC">OBSERVABILITY</text>
 <text x="24" y="72" font-size="12" fill="#C9D1D9">Prometheus · Grafana</text>
 <text x="24" y="98" font-size="12" fill="#8B949E">Metrics · Logs · Alerts</text>
