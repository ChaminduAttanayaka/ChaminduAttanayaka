<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg">
<defs><style>
text{font-family:Inter,Segoe UI,Arial,sans-serif}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-50}}
.p{animation:pulse 2.4s ease-in-out infinite}.d{stroke-dasharray:8 10;animation:dash 2.8s linear infinite}
</style></defs>
<rect width="1200" height="230" rx="26" fill="#07101C"/>
<text x="600" y="70" text-anchor="middle" font-size="24" font-weight="850" letter-spacing="3" fill="#F0F6FC">BUILD · AUTOMATE · OBSERVE · SCALE</text>
<text x="600" y="105" text-anchor="middle" font-size="14" fill="#8B949E">Cloud-native engineering with reliability and automation at the core</text>
<path d="M300 145H900" stroke="#58A6FF" stroke-opacity=".45" class="d"/>
<circle cx="300" cy="145" r="5" fill="#58A6FF" class="p"/><circle cx="600" cy="145" r="5" fill="#A78BFA" class="p"/><circle cx="900" cy="145" r="5" fill="#58A6FF" class="p"/>
<text x="600" y="190" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="3" fill="#6E7681">DEVOPS · CLOUD · PLATFORM ENGINEERING</text>
<rect x=".75" y=".75" width="1198.5" height="228.5" rx="25.25" fill="none" stroke="#30363D" stroke-width="1.5"/>
</svg>